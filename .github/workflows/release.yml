name: Release
on:
  push:
    tags: ['v*']

# 同一個 tag 的執行排隊、不互相取消（票 22）。它只協調 Actions 執行之間，不鎖 GitHub 介面上的
# 操作——所以 workflow 也不自動刪任何 Release（見 Verify + package 與 Publish 的註解）。
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14            # Apple Silicon (arm64)
    permissions:
      contents: write            # 建/編輯 release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 自建簽章憑證「Fledge Self-Signed」的 SHA-1 指紋（公開資訊；票 22）。憑證一換，這裡、
      # 兩個 secret、維護者筆記（docs/guides/signing-certificate.md）都要跟著換。
      EXPECTED_SIGNING_CERT_SHA1: '58fc82cf556c77f97577a6e040d8226b21f71029'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-darwin }

      - name: Version guard (format + tag base == tauri.conf.json)
        run: |
          # 只接受正式 vX.Y.Z 或 prerelease vX.Y.Z-rc.N（擋 -beta 等被當正式 publish）
          echo "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$' \
            || { echo "::error::tag 格式須為 vX.Y.Z 或 vX.Y.Z-rc.N，收到 ${GITHUB_REF_NAME}"; exit 1; }
          TAG="${GITHUB_REF_NAME#v}"; BASE="${TAG%%-*}"   # v0.1.0-rc.1 → 0.1.0
          CONF=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "tag base=$BASE conf=$CONF"
          [ "$BASE" = "$CONF" ] || { echo "::error::tag base $BASE != conf $CONF"; exit 1; }

      - name: Refuse existing release
        run: |
          set -euo pipefail
          # 這個 tag 已經有 Release（不論草稿或已發布）就停，什麼都不碰（票 22）。
          # 用列表 API 連草稿一起查——用 tag 查 Release 的端點看不到草稿。
          # 查詢本身失敗（網路、權限）會讓指令替換失敗、set -e 讓整步失敗，不會被當成「沒有」。
          FOUND=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .draft")
          if [ -n "${FOUND}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 已經有 Release，不重跑。已發布的不重發，要重發請升版號；草稿請先到 https://github.com/${GITHUB_REPOSITORY}/releases 確認後手動刪除，再重跑。"
            echo "查到的 draft 欄位：${FOUND}"
            exit 1
          fi

      - name: Build sidecar (onedir + nested codesign)
        run: |
          cd sidecar
          python3 -m venv .venv && source .venv/bin/activate
          pip install -e ".[dev]"
          ./build_binary.sh

      - run: npm ci

      - name: Import signing certificate
        env:
          FLEDGE_SIGNING_P12_BASE64: ${{ secrets.FLEDGE_SIGNING_P12_BASE64 }}
          FLEDGE_SIGNING_P12_PASSWORD: ${{ secrets.FLEDGE_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          # 把自建簽章憑證匯入臨時鑰匙圈，讓 tauri build 用設定檔裡的名稱簽章（票 22）。
          # 不能交給 Tauri 的 APPLE_CERTIFICATE：它只認 Apple 前綴的憑證名稱，找不到自建憑證。
          # 排在相依套件裝完之後：鑰匙圈解鎖後，同一個 job 裡的任何程式都能叫 codesign 用它
          # （step env 不是私鑰的隔離邊界），所以把這段時間壓到只剩打包本身。
          : "${FLEDGE_SIGNING_P12_BASE64:?缺少 secret FLEDGE_SIGNING_P12_BASE64}"
          : "${FLEDGE_SIGNING_P12_PASSWORD:?缺少 secret FLEDGE_SIGNING_P12_PASSWORD}"
          NAME=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['bundle']['macOS']['signingIdentity'])")
          P12="${RUNNER_TEMP}/fledge-signing.p12"
          KC="${RUNNER_TEMP}/fledge-signing.keychain-db"
          # 先裝 trap 再建任何檔案：.p12 無論成敗都刪；失敗時連鑰匙圈一起刪。
          # 成功時鑰匙圈交給 Remove signing keychain 在打包後刪。
          cleanup() {
            status=$?
            rm -f "${P12}"
            if [ "${status}" -ne 0 ]; then
              security delete-keychain "${KC}" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          printf '%s' "${FLEDGE_SIGNING_P12_BASE64}" | base64 --decode > "${P12}"
          KC_PASS=$(uuidgen)
          security create-keychain -p "${KC_PASS}" "${KC}"
          security unlock-keychain -p "${KC_PASS}" "${KC}"
          security set-keychain-settings "${KC}"
          security import "${P12}" -k "${KC}" -P "${FLEDGE_SIGNING_P12_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KC_PASS}" "${KC}" >/dev/null
          # 搜尋清單保留原有的、再加上這一個：tauri build 用名稱簽章時走搜尋清單
          LIST=$(security list-keychains -d user)
          KEYCHAINS=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%\"}"
            line="${line#\"}"
            if [ -n "${line}" ]; then KEYCHAINS+=("${line}"); fi
          done <<<"${LIST}"
          security list-keychains -d user -s ${KEYCHAINS[@]+"${KEYCHAINS[@]}"} "${KC}"
          IDS=$(security find-identity -p codesigning "${KC}")
          grep -Fq "\"${NAME}\"" <<<"${IDS}" || { echo "::error::匯入後在鑰匙圈裡找不到「${NAME}」"; exit 1; }
          echo "SIGNING_KEYCHAIN=${KC}" >> "${GITHUB_ENV}"

      - name: Tauri build
        run: |
          set -euo pipefail
          # 只打包、不碰 Release（票 22）：所有驗證通過後，才由 Verify + package 建草稿。
          # 原本的 tauri-action 在草稿模式下找既有 Release 只比 tag、不管是不是草稿，
          # 重跑已發布的 tag 時會在驗證前就把產物傳進公開 Release。
          npm run tauri build -- --target aarch64-apple-darwin

      - name: Remove signing keychain
        if: always()
        run: |
          set -euo pipefail
          # 打包一完成就刪，縮短私鑰可用的時間（票 22）。Import 沒跑到或失敗時沒有路徑——
          # 失敗時它自己的 trap 已經刪掉了。
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "${SIGNING_KEYCHAIN}"
          fi

      - name: Verify signing identity
        run: |
          set -euo pipefail
          # 發出去的 app 必須是這張憑證簽的（票 22）：ad-hoc 或別張憑證簽的版本，會讓所有使用者的
          # 完整磁碟取用授權在更新後失效。codesign -d -r- 的規則印在 stdout，Executable 那行在 stderr。
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Fledge.app"
          EXPECTED="designated => identifier \"dev.fledge.app\" and certificate leaf = H\"${EXPECTED_SIGNING_CERT_SHA1}\""
          REQ=$(codesign -d -r- "${APP}")
          ACTUAL=$(grep '^designated => ' <<<"${REQ}" || true)
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "::error::簽章身分不符。預期：${EXPECTED}"
            echo "實際：${ACTUAL:-（沒有 designated 規則）}"
            exit 1
          fi

      - name: Verify bundle (codesign + resource path + sidecar runs)
        run: |
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Fledge.app"
          codesign --verify --deep --strict --verbose=4 "$APP"
          SIDE="$APP/Contents/Resources/fledge-sidecar/fledge-sidecar"
          test -x "$SIDE" || { echo "::error::sidecar 不在 $SIDE"; exit 1; }
          # 啟動 sidecar，確認印出 FLEDGE_PORT 且 /api/health 真的回應——不只「曾印 port 後崩潰」
          # （__main__.py 先印 port 再 uvicorn.run，故 create_app/bind 失敗會在印 port 後；Codex PR-gate R2）
          FLEDGE_TEST_UNAUTH=1 "$SIDE" >/tmp/side.log 2>&1 & PID=$!
          PORT=""
          for _ in $(seq 1 20); do
            PORT=$(grep -m1 '^FLEDGE_PORT=' /tmp/side.log | cut -d= -f2 | tr -d '[:space:]')
            [ -n "$PORT" ] && break
            sleep 0.5
          done
          [ -n "$PORT" ] || { echo "::error::sidecar 未印 FLEDGE_PORT"; cat /tmp/side.log; kill "$PID" 2>/dev/null || true; exit 1; }
          OK=""
          for _ in $(seq 1 20); do
            curl -fsS --connect-timeout 1 --max-time 2 "http://127.0.0.1:$PORT/api/health" >/dev/null 2>&1 && { OK=1; break; }
            kill -0 "$PID" 2>/dev/null || break   # 進程已死（印 port 後崩潰）→ 別再等
            sleep 0.5
          done
          kill -TERM "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true
          [ -n "$OK" ] || { echo "::error::sidecar /api/health 無回應（啟動後崩潰？）"; cat /tmp/side.log; exit 1; }

      - name: Verify + package (驗證失敗就沒有可上傳的檔案)
        run: |
          # GitHub 預設 shell 是 `bash -e {0}`——**沒有 pipefail**。本步驟第④段是
          # `python3 -c ... | while read`，左側 python 若語法錯／import 失敗會非 0 退出，
          # 但右側 while 在零筆輸入下回 0，整條 pipeline 就變成 0，後面的 tar／upload／
          # publish 照樣執行＝驗證缺席卻靜默通過。fail-closed 必須自己開 pipefail。
          set -euo pipefail
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Fledge.app"
          STAGE="$APP/Contents/Resources/fledge-sidecar/_internal/templates"

          # ① 範本子樹逐檔對帳（缺 manifest／缺目錄／驗證器 import 失敗都會非 0 退出）
          test -d "$STAGE" || { echo "::error::.app 內找不到範本目錄 $STAGE"; exit 1; }
          test -f "$STAGE/artifact-manifest.json" || { echo "::error::缺 artifact manifest（檢查缺席視為失敗）"; exit 1; }
          python3 scripts/verify_templates_artifact.py \
            --staged-root "$STAGE" --manifest "$STAGE/artifact-manifest.json"

          # ② 收斂 build 來源。**注意這裡能保證什麼、不能保證什麼**：
          #    能保證——private staging 沒被帶入（env 未設 + 未帶 flag），
          #             public seed 的頂層目錄名都在 allowlist 且分類為 public。
          #    **不能保證**——public seed 的某個合法範本目錄「底下」放了不該公開的檔案。
          #             `project-starter/private-rules.md` 的頂層 id 完全合法，
          #             staging 會照收、manifest 會照登記、雜湊會照驗過。
          #             內容是不是私有是**人的分類**，CI 無從判斷。
          #    真正的控制是下面 ③ 的 drift 檢查：public seed 多一個檔案就必須連同
          #    manifest 一起提交，在 PR diff 裡顯形，由人審。
          #
          # 內嵌 python 必須與本 block 的其他行同縮排：literal block（`run: |`）的內容
          # 不得比第一行更淺，否則 scalar 在此結束、整份 workflow 變成無效 YAML。
          # YAML 會剝掉這層共同縮排，python 收到的仍是第 0 欄。
          [ -z "${FLEDGE_PRIVATE_TEMPLATES_DIR:-}" ] || {
            echo "::error::release 環境不得設定 FLEDGE_PRIVATE_TEMPLATES_DIR"; exit 1; }
          python3 -c "
          import sys; sys.path.insert(0, 'sidecar')
          from pathlib import Path
          from fledge_sidecar.setup.templates import TEMPLATE_SPECS
          private = {s.id for s in TEMPLATE_SPECS if s.source_class == 'private'}
          known = {s.id for s in TEMPLATE_SPECS}
          seed = Path('sidecar/resources/templates-public')
          present = {p.name for p in seed.iterdir() if p.is_dir()} if seed.is_dir() else set()
          assert not (present & private), f'public seed 內出現私有範本目錄：{present & private}'
          assert not (present - known), f'public seed 內有不在 allowlist 的目錄：{present - known}'
          print('public seed 頂層分類正確')
          "

          # ③ public seed 的 manifest drift：committed manifest 必須與實際內容逐項相符。
          #    這是「seed 裡多了一個檔案」唯一會被機械偵測到的地方——多的檔案若沒同步
          #    進 manifest 就在這裡失敗；同步了就會出現在 PR diff 裡讓人看見。
          python3 -c "
          import json, sys; sys.path.insert(0, 'sidecar')
          from pathlib import Path
          from fledge_sidecar.setup.templates import build_manifest_entries, MANIFEST_FILENAME
          for seed_dir in sorted(Path('sidecar/resources/templates-public').iterdir()):
              if not seed_dir.is_dir(): continue
              committed = json.loads((seed_dir / MANIFEST_FILENAME).read_text(encoding='utf-8'))
              generated = [{'path': e.path, 'type': e.type} for e in build_manifest_entries(str(seed_dir))]
              assert committed['entries'] == generated, f'{seed_dir.name}：manifest 與內容不符（drift）'
          print('public seed manifest 無 drift')
          "

          # ④ 額外保險：私有 id 的原名不該出現在 .app 任何路徑上（擋不住改名，但零成本）
          python3 -c "
          import sys; sys.path.insert(0, 'sidecar')
          from fledge_sidecar.setup.templates import TEMPLATE_SPECS
          print('\n'.join(s.id for s in TEMPLATE_SPECS if s.source_class == 'private'))
          " | while read -r id; do
            [ -n "$id" ] || continue
            if find "$APP" -name "*${id}*" -print -quit | grep -q .; then
              echo "::error::.app 內出現私有範本痕跡：$id"; exit 1
            fi
          done

          B="src-tauri/target/aarch64-apple-darwin/release/bundle"
          tar -czf Fledge_aarch64.app.tar.gz -C "$B/macos" Fledge.app
          # 確認剛好一個 dmg；用實際 basename（Tauri 打包器命名 Fledge_<ver>_aarch64.dmg）
          DMG_PATH=$(ls "$B"/dmg/*.dmg)
          [ "$(printf '%s\n' "$DMG_PATH" | wc -l)" -eq 1 ] || { echo "::error::dmg 不是剛好一個"; exit 1; }
          DMG=$(basename "$DMG_PATH")
          cp "$STAGE/artifact-manifest.json" ./templates-artifact-manifest.json
          shasum -a 256 Fledge_aarch64.app.tar.gz > checksums.txt
          ( cd "$B/dmg" && shasum -a 256 "$DMG" ) >> checksums.txt
          # 所有驗證都過了，才第一次碰 GitHub Release（票 22）。--verify-tag：tag 不在遠端就失敗，
          # 不讓 gh 自己從預設分支建一個 tag。可能已建立草稿、卻在上傳檔案時失敗——草稿不公開、
          # install.sh 也看不到；workflow 不自動刪（自動刪會刪到人工建的草稿），交給人處理。
          gh release create "${GITHUB_REF_NAME}" "$DMG_PATH" Fledge_aarch64.app.tar.gz \
            templates-artifact-manifest.json checksums.txt \
            --draft --verify-tag --title "Fledge ${GITHUB_REF_NAME}" --notes "" \
            || { echo "::error::建立草稿 Release 失敗。草稿可能已建立一半：到 https://github.com/${GITHUB_REPOSITORY}/releases 確認後手動刪除，再重跑。"; exit 1; }

      - name: Publish release (rc → prerelease)
        run: |
          set -euo pipefail
          # 回報失敗不代表沒發布：可能已公開、只是回應失敗（票 22）。workflow 不自動回滾，交給人確認。
          case "${GITHUB_REF_NAME}" in
            *-rc.*) gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease ;;
            *)      gh release edit "${GITHUB_REF_NAME}" --draft=false ;;
          esac || { echo "::error::發布失敗。回報失敗不代表沒發布：到 https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME} 確認實際狀態。"; exit 1; }
