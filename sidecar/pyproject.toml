[project]
name = "fledge-sidecar"
version = "1.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "ptyprocess>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "websockets>=13",
    "pyinstaller>=6.11",
    # test_release_workflow.py 解析 release.yml 用。原本只是 uvicorn[standard] 的傳遞
    # 相依（Required-by 為空），直接使用等於依賴一個沒宣告的東西。
    "pyyaml>=6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["slow: 效能煙囪"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fledge_sidecar"]
